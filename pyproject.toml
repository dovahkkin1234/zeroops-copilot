[project]
name = "zeroops-copilot"
version = "0.1.0"
description = "Multi-agent ZeroOps prototype — triage, investigate, and prevent incident recurrence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.4.0,<2.0",
    "pydantic-ai>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=2.5",
    "numpy>=1.24",
    "gitpython>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroops"]
